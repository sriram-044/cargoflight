server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: aerotrace-maa-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}

  # Primary Database: PostgreSQL (Port 5433 Local / 5432 Docker)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/aerotrace_india}
    username: ${SPRING_DATASOURCE_USERNAME:aerotrace_app}
    password: ${SPRING_DATASOURCE_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 600000
      pool-name: AerotraceHikariCP

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
          time_zone: Asia/Kolkata

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Telemetry Database: MongoDB
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/aerotrace_telemetry}
      auto-index-creation: false

  jackson:
    time-zone: Asia/Kolkata
    serialization:
      write-dates-as-timestamps: false

# Management & Health Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      roles: SYSTEM_ADMIN,DATABASE_ADMIN

# Aerotrace Specific Properties
aerotrace:
  airport:
    code: MAA
    name: "Chennai International Airport"
    city: "Chennai"
    country: "India"
    timezone: "Asia/Kolkata"
    latitude: 12.9941
    longitude: 80.1709
  security:
    jwt:
      secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration-ms: 86400000 # 24 hours
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    username: ${NEO4J_USERNAME:neo4j}
    password: ${NEO4J_PASSWORD:aerotrace_neo4j_2026}
    enabled: ${NEO4J_ENABLED:true}
  mysql:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/aerotrace_secondary?useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:aerotrace_sync}
    password: ${MYSQL_PASSWORD:aerotrace_mysql_password_2026}
    enabled: ${MYSQL_ENABLED:false}
  mongodb:
    enabled: ${MONGODB_ENABLED:true}
  demo-mode:
    enabled: ${AEROTRACE_DEMO_MODE:true}
