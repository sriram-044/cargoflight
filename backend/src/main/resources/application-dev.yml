# Local Development Profile with In-Memory H2 Database (PostgreSQL emulation)
# Use this when running on Windows without Docker Desktop started:
# mvn spring-boot:run -Dspring-boot.run.profiles=dev

spring:
  datasource:
    url: jdbc:h2:mem:cargoflight;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDER=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

# Keep optional services disabled in local dev profile
cargoflight:
  neo4j:
    enabled: false
  mysql:
    enabled: false
  mongodb:
    enabled: false

aerotrace:
  neo4j:
    enabled: false
  mysql:
    enabled: false
  mongodb:
    enabled: false
  demo-mode:
    enabled: true
