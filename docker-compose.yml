# CARGOFLIGHT Airport Cargo-Flight & Baggage Tracking System
# Runtime Architecture: Exactly 3 Database Systems
# 1. PostgreSQL 17: Operational Primary & Analytical Data Warehouse (cargoflight_dw schema)
# 2. MongoDB 7.0: Raw Telemetry & Scanner Events
# 3. Neo4j 5.20: Airport Handling Graph & Path Optimization

services:
  # 1. Primary Operational Database & Analytical Warehouse: PostgreSQL 17
  postgres:
    image: postgres:17-alpine
    container_name: cargoflight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aerotrace_india
      POSTGRES_USER: aerotrace_app
      POSTGRES_PASSWORD: aerotrace_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aerotrace_app -d aerotrace_india"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Scanner Telemetry Database: MongoDB 7.0
  mongodb:
    image: mongo:7.0
    container_name: cargoflight-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: aerotrace_telemetry
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./database/mongodb/init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Handling-Point Graph Database: Neo4j 5.20
  neo4j:
    image: neo4j:5.20-community
    container_name: cargoflight-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/aerotrace_neo4j_2026
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474" # Browser / HTTP
      - "7687:7687" # Bolt protocol
    volumes:
      - neo4j_data:/data
      - ./database/neo4j:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  mongo_data:
  neo4j_data:
